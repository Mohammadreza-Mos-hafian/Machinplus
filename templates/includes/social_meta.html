<meta property="og:locale" content="fa_IR">
<meta property="og:site_name" content="ماشین پلاس">
<meta property="og:type" content="{{ seo_type|default:'website' }}">
<meta property="og:title" content="{{ seo_title|default:'ماشین پلاس' }}">
<meta property="og:description"
      content="{{ seo_description|default:'ماشین پلاس، راهکار جامع تامین و نوسازی ماشین آلات صنعتی با امکان خرید اعتباری.' }}">
<meta property="og:url" content="{{ seo_url }}">

{% if seo_image %}
    <meta property="og:image" content="{{ seo_image }}">
    <meta property="og:image:alt" content="{{ seo_title }}">
{% endif %}

{% if seo_type == "article" %}
    <meta property="article:published_time" content="{{ seo_published_time }}">
    <meta property="article:modified_time" content="{{ seo_modified_time }}">
{% endif %}

{% if seo_image %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ seo_image }}">
    <meta name="twitter:image:alt" content="{{ seo_title }}">
{% else %}
    <meta name="twitter:card" content="summary">
{% endif %}

<meta name="twitter:title" content="{{ seo_title|default:'ماشین پلاس' }}">
<meta name="twitter:description" content="{{ seo_description|default:'مرجع قطعات و خدمات خودرو' }}">
