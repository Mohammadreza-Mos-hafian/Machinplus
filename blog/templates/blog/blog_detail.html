{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>مقاله | مجله ماشین پلاس</title>
    <meta name="description"
          content="مقالات تخصصی صنعت ماشین‌سازی، نگهداری تجهیزات و تامین هوشمند در مجله ماشین پلاس."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"/>
        <link rel="icon" type="image/x-icon" href="{% static 'site/medias/32x32.png' %}">

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'site/medias/32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'site/medias/16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'site/medias/180x180.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {sans: ['Vazirmatn', 'system-ui', 'sans-serif']},
                    colors: {
                        background: 'oklch(0.975 0.005 240)',
                        foreground: 'oklch(0.22 0.025 250)',
                        surface: '#ffffff',
                        'surface-muted': 'oklch(0.965 0.008 240)',
                        border: 'oklch(0.90 0.012 245)',
                        muted: 'oklch(0.955 0.008 240)',
                        'muted-foreground': 'oklch(0.48 0.015 250)',
                        primary: 'oklch(0.38 0.08 250)',
                        'primary-foreground': '#fff',
                        'primary-dark': 'oklch(0.28 0.07 252)',
                        accent: 'oklch(0.68 0.15 60)',
                        'accent-foreground': 'oklch(0.18 0.02 250)',
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(20,35,60,.04), 0 4px 16px rgba(20,35,60,.06)',
                        elevated: '0 4px 12px rgba(20,35,60,.08), 0 16px 40px rgba(20,35,60,.10)',
                        glow: '0 8px 32px rgba(31,78,121,.25)',
                    },
                }
            }
        }
    </script>
    <style>
        html, body {
            font-family: 'Vazirmatn', system-ui, sans-serif;
            background: oklch(0.965 0.008 240);
            color: oklch(0.22 0.025 250);
            -webkit-font-smoothing: antialiased
        }

        h1, h2, h3, h4 {
            letter-spacing: -0.01em
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden
        }
    </style>
</head>
<body class="min-h-screen bg-surface-muted">

<header class="sticky top-0 z-30 border-b border-border bg-white/95 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6 lg:px-8">
        <a href="{% url 'core:home' %}" class="flex items-center gap-2">
            <span class="grid h-8 w-8 place-items-center rounded-lg bg-primary text-white font-extrabold">م+</span>
            <span class="font-extrabold text-foreground">ماشین پلاس</span>
        </a>
        <nav aria-label="ناوبری اصلی" class="hidden items-center gap-6 text-sm text-muted-foreground md:flex">
            <a href="{% url 'core:home' %}" class="transition-colors hover:text-foreground">خانه</a>
            <a href="{% url 'shop:product_list' %}" class="transition-colors hover:text-foreground">فروشگاه</a>
            <a href="{% url 'blog:list' %}" class="font-semibold text-foreground">مجله</a>
            <a href="{% url 'blog:list' %}" class="text-foreground">درباره ما</a>
            <a href="{% url 'blog:list' %}" class="text-foreground">تماس با ما</a>
        </nav>
        <a href="{% url 'core:inquiry' %}"
           class="inline-flex items-center gap-1.5 rounded-xl bg-primary px-3.5 py-2 text-xs font-bold text-white shadow-soft hover:bg-primary-dark sm:text-sm">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            مشاوره رایگان
        </a>
    </div>
</header>

<div id="app"></div>

<footer class="mt-10 border-t border-border bg-white py-8">
    <div class="mx-auto max-w-7xl px-4 text-center text-xs text-muted-foreground sm:px-6 lg:px-8">© ۱۴۰۵ ماشین پلاس —
        مجله صنعت
    </div>
</footer>

<a href="chat.html" aria-label="گفت‌وگو با دستیار هوشمند"
   class="fixed bottom-5 left-5 z-40 inline-flex items-center gap-2 rounded-full bg-primary px-4 py-3 text-sm font-bold text-white shadow-glow transition-all hover:-translate-y-0.5 hover:bg-primary-dark active:scale-95">
    <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
    <span class="hidden sm:inline">پرسش از دستیار</span>
</a>
{{ article_json|json_script:"article-data" }}
{{ related_articles_json|json_script:"related-data" }}

<script>
    const BLOG_CATEGORIES = [{"id": "all", "label": "همه مقالات"}, {
        "id": "cnc",
        "label": "ماشین‌کاری و CNC"
    }, {"id": "maintenance", "label": "نگهداری و تعمیرات"}, {"id": "buying", "label": "راهنمای خرید"}, {
        "id": "market",
        "label": "بازار و اقتصاد صنعت"
    }, {"id": "tech", "label": "فناوری و هوش مصنوعی"}];
    const BLOG_POSTS = JSON.parse(document.getElementById("related-data").textContent);

    const faNum = (n) => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[+d]);
    const catLabel = (id) => (BLOG_CATEGORIES.find(c => c.id === id) || {}).label || id;

    const slug = ""
    const post = JSON.parse(document.getElementById("article-data").textContent);
    const app = document.getElementById("app");

    if (!post) {
        app.innerHTML = `<div class="mx-auto max-w-2xl px-4 py-24 text-center">
    <h1 class="text-2xl font-extrabold text-foreground">مقاله موردنظر یافت نشد</h1>
    <p class="mt-3 text-sm leading-7 text-muted-foreground">ممکن است آدرس اشتباه باشد یا مقاله حذف شده باشد.</p>
    <a href="blog.html" class="mt-6 inline-flex items-center gap-2 rounded-xl bg-primary px-5 py-3 text-sm font-bold text-white shadow-soft transition-colors hover:bg-primary-dark">بازگشت به مجله</a>
  </div>`;
    } else {
        document.title = post.title + " | مجله ماشین پلاس";
        document.querySelector('meta[name="description"]').setAttribute("content", post.excerpt);

        const block = (b) => {
            switch (b.type) {
                case "h2":
                    return `<h2 class="pt-4 text-xl font-extrabold leading-9 text-foreground">${b.text}</h2>`;
                case "h3":
                    return `<h3 class="pt-2 text-base font-bold leading-8 text-foreground">${b.text}</h3>`;
                case "p":
                    return `<p class="text-[15px] leading-9 text-muted-foreground">${b.text}</p>`;
                case "quote":
                    return `<blockquote class="rounded-2xl border-r-4 border-accent bg-muted/60 p-5">
        <p class="text-[15px] font-semibold leading-9 text-foreground">«${b.text}»</p>
        ${b.cite ? `<footer class="mt-2 text-xs text-muted-foreground">— ${b.cite}</footer>` : ""}</blockquote>`;
                case "ul":
                    return `<ul class="space-y-2.5">${b.items.map(it => `<li class="flex gap-3 text-[15px] leading-8 text-muted-foreground"><span class="mt-3 h-1.5 w-1.5 shrink-0 rounded-full bg-accent"></span><span>${it}</span></li>`).join("")}</ul>`;
                case "ol":
                    return `<ol class="space-y-2.5">${b.items.map((it, i) => `<li class="flex gap-3 text-[15px] leading-8 text-muted-foreground"><span class="mt-1 grid h-6 w-6 shrink-0 place-items-center rounded-lg bg-primary/10 text-[11px] font-bold text-primary">${faNum(i + 1)}</span><span>${it}</span></li>`).join("")}</ol>`;
                default:
                    return "";
            }
        };

        const shareUrl = location.href;
        const shareBtn = (label, href, svg) => `<a href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}" title="${label}" class="grid h-9 w-9 place-items-center rounded-lg border border-border bg-white text-muted-foreground transition-all hover:-translate-y-0.5 hover:border-primary/40 hover:text-primary">${svg}</a>`;

        const others = JSON.parse(document.getElementById("related-data").textContent);
        const related = JSON.parse(document.getElementById("related-data").textContent);

        const meta = (p, cls) => `<div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-[11px] text-muted-foreground ${cls}">
    <time datetime="${p.date}" class="font-semibold text-foreground">${p.dateFa}</time>
    <span aria-hidden="true">•</span><span>${faNum(p.readingMinutes)} دقیقه مطالعه</span>
    <span aria-hidden="true">•</span><span>${p.author}</span></div>`;

        const card = (p) => `<article class="group flex h-full flex-col overflow-hidden rounded-2xl border border-border bg-white shadow-soft transition-all hover:-translate-y-1 hover:shadow-elevated">
    <a href="/blog/${p.id}/${p.slug}" class="relative block overflow-hidden">
      <img src="${p.image}" alt="${p.title}" loading="lazy" class="h-44 w-full object-cover transition-transform duration-500 group-hover:scale-105" />
      <span class="absolute right-3 top-3 rounded-full bg-white/95 px-2.5 py-1 text-[11px] font-bold text-primary shadow-soft backdrop-blur-sm">${catLabel(p.category)}</span>
    </a>
    <div class="flex flex-1 flex-col p-5">
      <h3 class="text-base font-extrabold leading-8 text-foreground"><a href="/blog/${p.id}/${p.slug}" class="transition-colors hover:text-primary">${p.title}</a></h3>
      <p class="mt-2 line-clamp-3 flex-1 text-sm leading-7 text-muted-foreground">${p.excerpt}</p>
      ${meta(p, "mt-4 border-t border-border pt-4")}
    </div></article>`;

        app.innerHTML = `
  <article class="pb-4">
    <header class="border-b border-border bg-white">
      <div class="mx-auto max-w-4xl px-4 pb-8 pt-6 sm:px-6 sm:pb-10 sm:pt-8">
        <nav aria-label="مسیر صفحه" class="mb-4 flex items-center gap-2 text-xs text-muted-foreground">
          <a href="index.html" class="transition-colors hover:text-foreground">خانه</a><span aria-hidden="true">/</span>
          <a href="blog.html" class="transition-colors hover:text-foreground">مجله</a><span aria-hidden="true">/</span>
          <span class="truncate text-foreground">${catLabel(post.category)}</span>
        </nav>
        <h1 class="mt-3 text-2xl font-extrabold leading-[1.9] text-foreground sm:text-4xl sm:leading-[1.7]">${post.title}</h1>
        <div class="mt-6 grid grid-cols-[minmax(0,1fr)_auto] items-center gap-4 sm:flex sm:flex-wrap sm:justify-between">
          <div class="flex min-w-0 items-center gap-3">
            <div class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-gradient-to-br from-primary to-primary-dark text-xs font-bold text-white shadow-soft">م+</div>
            <div class="min-w-0">
              <div class="truncate text-sm font-bold text-foreground">${post.author}</div>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-muted-foreground">
            <time datetime="${post.date}" class="font-semibold text-foreground">${post.dateFa}</time>
            <span aria-hidden="true">•</span><span>${faNum(post.readingMinutes)} دقیقه مطالعه</span>
          </div>
        </div>
      </div>
      <div class="mx-auto max-w-5xl px-4 pb-8 sm:px-6">
        <img src="${post.image}" alt="${post.title}" class="h-56 w-full rounded-3xl object-cover shadow-elevated sm:h-96" />
      </div>
    </header>

    <div class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <div class="rounded-3xl border border-border bg-white p-6 shadow-soft sm:p-10">
        <div class="space-y-5">${post.body?.[0]?.content || ''}</div>

        <div class="mt-8 flex flex-wrap items-center gap-2 border-t border-border pt-6">
          <span class="text-xs font-bold text-foreground">برچسب‌ها:</span>
          ${post.tags.map(t => `<span class="rounded-full border border-border bg-muted px-3 py-1 text-xs text-muted-foreground">#${t}</span>`).join("")}
        </div>

        <div class="mt-6 flex flex-wrap items-center gap-2 border-t border-border pt-6">
          <span class="ml-1 text-xs font-bold text-foreground">اشتراک‌گذاری:</span>
          ${shareBtn("اشتراک در ایکس (توییتر)", `https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(shareUrl)}`, '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M18.2 2H21l-6.6 7.5L22 22h-6.1l-4.8-6.3L5.6 22H2.8l7-8L2 2h6.2l4.4 5.8L18.2 2Zm-1 18.3h1.7L7.9 3.6H6.1l11.1 16.7Z"/></svg>')}
          ${shareBtn("اشتراک در لینکدین", `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`, '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-.95 1.83-1.95 3.76-1.95C21.4 8.75 22 11.1 22 14.1V21h-4v-6.1c0-1.45-.03-3.3-2.02-3.3-2.02 0-2.33 1.57-2.33 3.2V21h-3.9V9Z"/></svg>')}
          ${shareBtn("اشتراک در تلگرام", `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(post.title)}`, '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M21.5 4.3 2.9 11.4c-.9.4-.9 1.1-.2 1.3l4.7 1.5 1.8 5.5c.2.6.4.8 1 .8.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.2-.5-1.8-1.6-1.4Z"/></svg>')}
          ${shareBtn("اشتراک در واتساپ", `https://wa.me/?text=${encodeURIComponent(post.title + " " + shareUrl)}`, '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2Zm5.4 14c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.5-1.2-2.9s.7-2 1-2.3c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5-.3.3c-.1.1-.2.3 0 .5.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.2.1.4.1.5-.1l.8-.9c.2-.2.3-.2.5-.1l2 .9c.2.1.4.2.4.3.1.2.1.8-.1 1.4Z"/></svg>')}
        </div>
      </div>

      <div class="mt-10">
        <aside class="overflow-hidden rounded-3xl border border-border bg-gradient-to-br from-primary to-primary-dark p-6 shadow-elevated sm:p-8">
          <div class="flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
            <div class="min-w-0">
              <div class="mb-2 inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-white">
                <span class="h-1 w-1 rounded-full bg-accent"></span> دستیار هوشمند
              </div>
              <h2 class="text-lg font-extrabold text-white sm:text-xl">سوالی درباره این موضوع دارید؟</h2>
              <p class="mt-2 max-w-xl text-sm leading-7 text-white/80">دستیار هوشمند ماشین پلاس می‌تواند بر اساس شرایط کارگاه شما، گزینه‌های دقیق و تامین‌کنندگان معتبر را پیشنهاد دهد.</p>
            </div>
            <a href="chat.html" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-accent px-5 py-3 text-sm font-bold text-accent-foreground shadow-soft transition-all hover:brightness-105 active:scale-[0.98]">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              شروع گفت‌وگو
            </a>
          </div>
        </aside>
      </div>
    </div>
  </article>

  <section class="mx-auto max-w-7xl px-4 pb-12 sm:px-6 lg:px-8">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-sm font-bold text-foreground">مقالات مرتبط</h2>
      <a href="/blog/" class="text-xs font-semibold text-primary transition-colors hover:text-primary-dark">مشاهده همه مقالات</a>
    </div>
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">${related.map(card).join("")}</div>
  </section>`;
    }
</script>
</body>
</html>
